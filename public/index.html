<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پیام‌رسان من</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Tahoma, sans-serif; background: #0f172a; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .chat-container { width: 100%; max-width: 450px; height: 90vh; background: #1e293b; border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .chat-header { background: #2563eb; color: white; padding: 16px; font-size: 18px; font-weight: bold; text-align: center; }
        .chat-messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; word-wrap: break-word; }
        .message.me { background: #2563eb; color: white; align-self: flex-start; border-bottom-right-radius: 4px; }
        .message.other { background: #334155; color: #e2e8f0; align-self: flex-end; border-bottom-left-radius: 4px; }
        .chat-input { display: flex; padding: 12px; background: #0f172a; gap: 8px; }
        .chat-input input { flex: 1; padding: 12px; border: none; border-radius: 24px; background: #1e293b; color: white; font-size: 14px; outline: none; }
        .chat-input button { padding: 12px 20px; border: none; border-radius: 24px; background: #2563eb; color: white; font-size: 14px; cursor: pointer; font-weight: bold; }
        .chat-input button:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">💬 پیام‌رسان من</div>
        <div class="chat-messages" id="messages"></div>
        <div class="chat-input">
            <input type="text" id="messageInput" placeholder="پیام خود را بنویسید..." />
            <button onclick="sendMessage()">ارسال</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const messagesDiv = document.getElementById('messages');
        const input = document.getElementById('messageInput');

        function addMessage(text, type) {
            const div = document.createElement('div');
            div.className = 'message ' + type;
            div.textContent = text;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function sendMessage() {
            const text = input.value.trim();
            if (!text) return;
            socket.emit('sendMessage', text);
            addMessage(text, 'me');
            input.value = '';
        }

        socket.on('newMessage', (msg) => {
            addMessage(msg, 'other');
        });

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        addMessage('سلام! به پیام‌رسان خودت خوش آمدی 👋', 'other');
    </script>
</body>
</html>
